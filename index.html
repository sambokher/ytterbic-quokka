<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ytterbic Quokka</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #f7f5f0;
      --ink: #1a1a1a;
      --muted: #6b6b6b;
      --accent: #8b7355;
      --warm: #e8e2d9;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Outfit', sans-serif;
      font-weight: 300;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
      position: relative;
    }

    .page::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(139, 115, 85, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(139, 115, 85, 0.04) 0%, transparent 40%);
      pointer-events: none;
    }

    .content {
      max-width: 42rem;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.5rem, 8vw, 4rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards;
    }

    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      font-style: italic;
      font-weight: 400;
      color: var(--muted);
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.2s forwards;
    }

    .description {
      font-size: 1rem;
      color: var(--muted);
      max-width: 28rem;
      margin: 0 auto 2.5rem;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.35s forwards;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      font-family: 'Outfit', sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent);
      background: transparent;
      border: 1px solid var(--accent);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.5s forwards;
    }

    .cta:hover {
      background: var(--accent);
      color: var(--cream);
    }

    .highlights {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr));
      gap: 2rem;
      max-width: 36rem;
      margin: 3rem auto 0;
      padding-top: 2.5rem;
      border-top: 1px solid var(--warm);
    }

    .highlight {
      text-align: center;
    }

    .highlight-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 0.25rem;
    }

    .highlight-desc {
      font-size: 0.8125rem;
      color: var(--muted);
      font-weight: 300;
    }

    .footer {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(1rem);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="content">
      <h1 class="logo">Ytterbic Quokka</h1>
      <p class="tagline">Simple, refined, and quietly distinctive</p>
      <p class="description">A minimal space for thoughtful work. Crafted with care and attention to detail.</p>
      <a href="#" class="cta">Coming soon</a>
      <div class="highlights">
        <div class="highlight">
          <p class="highlight-title">Thoughtful</p>
          <p class="highlight-desc">Every detail considered</p>
        </div>
        <div class="highlight">
          <p class="highlight-title">Minimal</p>
          <p class="highlight-desc">Nothing unnecessary</p>
        </div>
        <div class="highlight">
          <p class="highlight-title">Refined</p>
          <p class="highlight-desc">Quality over quantity</p>
        </div>
      </div>
    </div>
    <footer class="footer">Est. 2025</footer>
  </main>
</body>
</html>
